<script>
    const newDiv = document.createElement('div');
    console.log(newDiv);

    newDiv.innerHTML = "Hello World";
    newDiv.className = "div1";
    newDiv.id = Math.floor(Math.random()*10+1);
    newDiv.setAttribute('title', 'divTitle');
    newDiv.style.color = '#ffffff';
    newDiv.style.backgroundColor = 'lightblue';
    newDiv.style.padding = '13px';
    // newDiv.innerText = "first div";

    const addText = document.createTextNode("First Div");
    newDiv.appendChild(addText);

    document.body.appendChild(newDiv);
</script>

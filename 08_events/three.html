<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async project 2</title>
</head>
<body style="background-color: #131313; color: aliceblue;">
    <h1 class="heading">Async Project 2</h1>
    <button id="start" , style="background-color: rgb(76, 76, 190); color: aliceblue ;  padding : 10px ; font-size: 28px; border-radius: 20px ;">Start</button>
    <button id="stop" , style="background-color: rgb(235, 73, 73) ; color: aliceblue ;  padding : 10px ; font-size: 28px; border-radius: 20px ;">Stop</button>
</body>
<script>
    const sayHiii = function(){
        console.log("hiii");
        console.log(intervalId);
        
    }

    let intervalId;

    
    document.querySelector('#start').addEventListener('click',function(){
        if(intervalId == null){
        intervalId = setInterval(sayHiii,1000);
        }
    });

    document.querySelector('#stop').addEventListener('click' , function(){
        clearInterval(intervalId);
        intervalId = null;
    }); 

    
     

     

</script>
</html>
